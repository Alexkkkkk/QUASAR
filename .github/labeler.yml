contracts:
  - changed-files:
      - any-glob-to-any-file: ['tolk/contracts/**', 'tolk/Acton.toml']

tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']

dapp:
  - changed-files:
      - any-glob-to-any-file: ['website/**', 'integrations/**']

defi:
  - changed-files:
      - any-glob-to-any-file: ['tolk/contracts/QuasarDeFi.tolk']

ton-docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/ton/**', 'scripts/sync_ton_docs.py']

security:
  - changed-files:
      - any-glob-to-any-file: ['SECURITY.md', 'docs/SECURITY_AUDIT.md', 'scripts/security_check.ts']

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - '**/package.json'
          - '**/package-lock.json'
