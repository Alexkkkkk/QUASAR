name: QUASAR AI issue agent (reusable module)

# Reusable ai-fix module (epic #145, Шаг 3 / issue #148). The policies are
# unchanged: the label only works from the owner, protected paths are
# rejected, the generated patch is validated on an isolated checkout, and the
# module can only open a draft pull request. The caller passes only the one
# secret the agent needs — never `secrets: inherit`.

on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event.label.name == 'ai-fix' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require the Groq API key
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GROQ_API_KEY" ]]; then
            echo "::error title=Missing Groq API key::The caller must pass the GROQ_API_KEY secret to this reusable workflow."
            exit 1
          fi

      - name: Generate a scoped patch with Groq
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_URL: "https://api.groq.com/openai/v1/chat/completions"
          GROQ_MODEL: "openai/gpt-oss-120b"
        run: |
          set -euo pipefail
          # Patch-only agent: bounded RAG context goes to the OpenAI-compatible
          # Groq endpoint, the model has no tools and returns a unified diff
          # validated by scripts/ollama_issue_agent.py::validate_patch.
          python3 scripts/groq_issue_agent.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/ai-fix.patch" \
            --repo-root "$GITHUB_WORKSPACE" \
            --docs-dir docs/ton

      - name: Collect patch and reject protected paths
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix.patch"
          if [[ ! -s "$patch_file" ]]; then
            echo "::error::The generated patch is empty. No artifact or pull request was created."
            exit 1
          fi
          if ! git apply --check "$patch_file"; then
            echo "::error::The generated patch does not apply cleanly. No artifact or pull request was created."
            exit 1
          fi
          changed=$(git apply --numstat "$patch_file" | cut -f3-)
          if [[ -z "$changed" ]]; then
            echo "::error::Groq produced no file changes. No pull request was created."
            exit 1
          fi
          protected_pattern='(^\.github/workflows/|^GROQ\.md$|^docs/AI_AGENT\.md$|^docs/ai/AI_ISSUE_AGENT\.md$|^package(-lock)?\.json$|^scripts/(deploy[^/]*|security_check\.ts|check_deployment\.ts|hub_audit\.ts|sync_action_pins\.ts)$|(^|/)(deployment\.json|build-hashes\.json|action_pins\.lock\.json)$|(^|/)\.env($|\.)(^|/)(seed([_-]?phrase)?|mnemonic|private[-_]?key|wallet[-_]?credentials?)(/|\.|$))'
          blocked=$(printf '%s\n' "$changed" | grep -E "$protected_pattern" || true)
          if [[ -n "$blocked" ]]; then
            echo "::error::The patch touches protected files. No artifact or pull request was created."
            printf '%s\n' "$blocked"
            exit 1
          fi

      - name: Upload patch for isolated validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    uses: ./.github/workflows/_checks.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
      patch_artifact: ai-fix-patch
    permissions:
      actions: read
      contents: read

  open-draft-pr:
    needs: [generate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download validated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix/ai-fix.patch"
          git apply --check "$patch_file"
          git apply "$patch_file"

      - name: Create or update a draft pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/${{ github.event.issue.number }}-agent
          base: ${{ github.event.repository.default_branch }}
          commit-message: "feat(ai-agent): address issue #${{ github.event.issue.number }}"
          title: "AI draft for issue #${{ github.event.issue.number }}"
          body: |
            AI-generated changes for #${{ github.event.issue.number }}. Review every hunk before marking this draft ready.

            The patch was validated before this PR was created: [open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            The run creates a separate branch and draft PR only. It does not merge, deploy, use wallet credentials, or perform on-chain actions.

            Fixes #${{ github.event.issue.number }}
          draft: always-true
          delete-branch: true
