name: AI branch auto-merge (reusable module)

# Fully autonomous merge module. The repository owner adds the `ai-merge-ok`
# label to a pull request (or the scout/pr-polish loop adds it automatically);
# the module then merges only that pull request, and only when every safety
# condition holds:
#   - the head branch is an agent branch (`ai/*`, `copilot/*`, `autopilot/*`,
#     `fix/*`);
#   - the required status checks are all green;
#   - the `do-not-merge` label is absent.
# Branch protection requires only the status checks — no review gate (fully
# autonomous AI mode). Anything else is
# refused with an explanatory comment. The module never touches non-agent
# branches, never deploys, never performs on-chain actions.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ai-merge-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Decide whether agent branches may be merged
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$ACTOR" != "$OWNER" || "$LABEL" != "ai-merge-ok" ]]; then
            echo "::notice::ai-merge is owner-only and requires the ai-merge-ok label; nothing to do."
            exit 0
          fi

          pr=$(gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" \
            --json number,headRefName,isDraft,mergeStateStatus,labels \
            --jq '.' 2>/dev/null || true)
          if [[ -z "$pr" ]]; then
            echo "::notice::#$TARGET is not a pull request; ai-merge only merges pulled requests."
            exit 0
          fi

          head=$(jq -r '.headRefName' <<< "$pr")
          if [[ "$head" != ai/* && "$head" != copilot/* && "$head" != autopilot/* && "$head" != fix/* ]]; then
            echo "::warning title=ai-merge refused::Branch $head is not an agent branch; merge it by hand."
            exit 0
          fi
          # Agent pull requests are opened as drafts (draft-only policy).
          # Mark the draft ready and CONTINUE in the same run: the remaining
          # guards (do-not-merge, green status rollup, --auto merge) all run
          # against this exact head commit, so a second labeling round adds
          # nothing but latency (fixes the two-step flow of #155).
          if [[ "$(jq -r '.isDraft' <<< "$pr")" == "true" ]]; then
            echo "::notice::Marking draft pull request #$TARGET as ready for review."
            gh pr ready "$TARGET" --repo "$GITHUB_REPOSITORY"
            echo "::notice::PR #$TARGET is ready; continuing with the merge checks."
          fi
          if jq -e '.labels[].name | select(. == "do-not-merge")' <<< "$pr" >/dev/null; then
            echo "::warning title=ai-merge refused::The do-not-merge label is present."
            exit 0
          fi
          # Fully autonomous mode: there is no review gate — the required
          # status checks are the only quality gate.

          rollup=$(gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | (.conclusion // .state // "PENDING")] | if length == 0 then "none" elif all(. == "SUCCESS" or . == "NEUTRAL" or . == "SKIPPED") then "green" else "pending" end')
          if [[ "$rollup" != "green" ]]; then
            echo "::warning title=ai-merge refused::Status checks are not green ($rollup)."
            exit 0
          fi

          # `--auto` queues the merge once the branch-protection gates (required
          # status checks) are satisfied; it never bypasses them (#155).
          gh pr merge "$TARGET" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
          echo "::notice::Auto-merge enabled for agent pull request #$TARGET ($head); GitHub will merge it once all branch-protection rules are satisfied."
