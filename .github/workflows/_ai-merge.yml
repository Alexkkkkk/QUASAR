name: AI branch auto-merge (reusable module)

# Optional fast-path for an agent PR. The repository owner or an automation may
# add `ai-merge-ok`, but this is not an approval: the regular automerge scheduler
# handles every green PR without the label. This module queues only when every safety
# condition holds:
#   - the head branch is an agent branch (`ai/*`, `copilot/*`, `autopilot/*`,
#     `fix/*`);
#   - every one of the six required status contexts is SUCCESS on the current head;
#   - the `do-not-merge` label is absent.
# Branch protection requires zero approving reviews and the same status checks.
# Anything else is
# refused with an explanatory comment. The module never touches non-agent
# branches, never deploys, never performs on-chain actions.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ai-merge-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Decide whether agent branches may be merged
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$ACTOR" != "$OWNER" || "$LABEL" != "ai-merge-ok" ]]; then
            echo "::notice::ai-merge is owner-only and requires the ai-merge-ok label; nothing to do."
            exit 0
          fi

          pr=$(gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" \
            --json number,headRefName,headRefOid,isDraft,mergeStateStatus,labels,statusCheckRollup \
            --jq '.' 2>/dev/null || true)
          if [[ -z "$pr" ]]; then
            echo "::notice::#$TARGET is not a pull request; ai-merge only merges pulled requests."
            exit 0
          fi

          head=$(jq -r '.headRefName' <<< "$pr")
          if [[ "$head" != ai/* && "$head" != copilot/* && "$head" != autopilot/* && "$head" != fix/* ]]; then
            echo "::warning title=ai-merge refused::Branch $head is not an agent branch; nothing to do."
            exit 0
          fi
          if jq -e '.labels[].name | select(. == "do-not-merge")' <<< "$pr" >/dev/null; then
            echo "::warning title=ai-merge refused::The do-not-merge label is present."
            exit 0
          fi
          required_checks=(
            "validate / verify"
            "CodeQL"
            "Tests (contracts)"
            "Tests (dapp)"
            "Tests (python)"
            "review"
          )
          rollup=$(jq -c '[.statusCheckRollup[]? | {name:(.name // .context), state:(.conclusion // .state // "PENDING")}]' <<< "$pr")
          for context in "${required_checks[@]}"; do
            state=$(jq -r --arg context "$context" '[.[] | select(.name == $context) | .state] | if length == 0 then "MISSING" else .[-1] end' <<< "$rollup")
            if [[ "$state" != "SUCCESS" ]]; then
              echo "::notice::Not queueing #$TARGET: required check '$context' is $state."
              exit 0
            fi
          done

          # Promote only after the required gates pass, then queue GitHub's
          # server-side auto-merge (the strict ruleset is still authoritative).
          if [[ "$(jq -r '.isDraft' <<< "$pr")" == "true" ]]; then
            gh pr ready "$TARGET" --repo "$GITHUB_REPOSITORY"
            current_head=$(gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
            if [[ "$current_head" != "$(jq -r '.headRefOid' <<< "$pr")" ]]; then
              echo "::notice::Head changed while promoting the draft; fresh checks are required."
              exit 0
            fi
          fi

          # `--auto` never bypasses required checks or other active rules.
          gh pr merge "$TARGET" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
          echo "::notice::Auto-merge enabled for agent pull request #$TARGET ($head); GitHub will merge it once all branch-protection rules are satisfied."
