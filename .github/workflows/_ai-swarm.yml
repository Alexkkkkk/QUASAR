name: ai-swarm-sync

# Reusable cross-agent learning module. Runs the full loop:
#   validate lessons -> learn (promote proven rules) -> sync (consistency)
#   -> rag (rebuild shared index) -> open a DRAFT PR for human review.
# Triggered only through the hub (swarm-dispatch.yml); it never declares
# its own event triggers, mirroring every other `_`-module.
#
# Idle mode: the hub calls this module every 30 minutes; a cheap scout
# job (seconds) skips the entire expensive cycle when there is nothing
# new to learn. Compute is spent only when the knowledge base changed.
#
# llm_backend=ollama runs a fully-local deep cycle: Ollama is installed
# inside the runner, the model is cached between runs, and no knowledge
# ever leaves the machine.
#
# Hard boundaries (same policy as the rest of the AI surface):
#   - draft PR only, never auto-merge
#   - no on-chain actions, no deployments
#   - secrets in the knowledge base fail the run loudly

on:
  workflow_call:
    inputs:
      max_turns:
        description: 'Safety brake on learning iterations'
        type: number
        default: 15
      llm_backend:
        description: 'LLM backend for polish/adversarial steps'
        type: string
        default: 'groq'
      ollama_model:
        description: 'Model to pull when llm_backend=ollama (CPU-friendly small model)'
        type: string
        default: 'qwen2.5-coder:1.5b'

permissions:
  contents: read

env:
  TURN: ${{ github.run_attempt }}

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Idle check — anything new since last cycle?
        id: check
        run: |
          if node scripts/ai/swarm/cli.mjs pending; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "idle: skipping full learning cycle"
            else
              echo "::error::pending check failed with exit code $status"
              exit "$status"
            fi
          fi

  swarm:
    needs: [scout]
    if: needs.scout.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.llm_backend == 'ollama' && 45 || 15 }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up local Ollama (llm_backend=ollama)
        if: inputs.llm_backend == 'ollama'
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$HOME/.ollama/models"
          echo "OLLAMA_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"

      - name: Cache Ollama model (llm_backend=ollama)
        if: inputs.llm_backend == 'ollama'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.ollama_model }}-${{ runner.os }}

      - name: Start Ollama and pull model (llm_backend=ollama)
        if: inputs.llm_backend == 'ollama'
        env:
          MODEL: ${{ inputs.ollama_model }}
        run: |
          set -e
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Safety brake — stop after ${{ inputs.max_turns || 15 }} iterations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_TURNS: ${{ inputs.max_turns || 15 }}
        run: |
          TURN=${TURN:-1}
          if [ "$TURN" -gt "$MAX_TURNS" ]; then
            echo "::error::swarm turn limit reached ($TURN). Human must reset."
            gh issue create --title "swarm: needs-human (turn limit)" --label needs-human --body "Learning cycle hit the safety brake. Review drafts manually." || true
            exit 1
          fi

      - name: Validate knowledge base (schema + poison scan)
        run: node scripts/ai/swarm/cli.mjs sync

      - name: Learn — aggregate lessons into rule drafts
        env:
          OLLAMA_URL: ${{ inputs.llm_backend == 'ollama' && 'http://127.0.0.1:11434' || '' }}
          OLLAMA_MODEL: ${{ inputs.llm_backend == 'ollama' && inputs.ollama_model || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/ai/swarm/cli.mjs learn

      - name: Rebuild shared RAG index
        run: node scripts/ai/swarm/cli.mjs rag

      - name: Open draft PR with promoted rules
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ai/swarm-sync
          title: 'ai(swarm): knowledge sync — promoted rules'
          body: |
            Automated cross-agent learning cycle.

            - Promoted rules: see `docs/ai/knowledge/drafts/`
            - Consistency report: `docs/ai/knowledge/state/sync-report.md`
            - Policy: draft only, human review required, no auto-merge.

            Reviewers: check for rule conflicts and quarantined entries before merge.
          labels: ai-sync
          draft: true
          add-paths: |
            docs/ai/knowledge/
