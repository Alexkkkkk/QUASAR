name: QUASAR Acton checks

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Acton build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
        with:
          working-directory: tolk
          version: '1.2.1'

      - name: Initialize Acton project
        working-directory: tolk
        run: acton init --stdlib-only

      - name: Inspect resolved Acton project
        working-directory: tolk
        run: acton doctor

      - name: Check formatting
        working-directory: tolk
        run: acton fmt --check

      - name: Check Tolk sources with GitHub annotations
        working-directory: tolk
        run: acton check --output-format github

      - name: Build contracts and wrappers
        working-directory: tolk
        run: |
          acton build
          acton wrapper --all --output-dir build/synchronized/wrappers

      - name: Run native Acton tests
        working-directory: tolk
        run: acton test

      - name: Export SARIF diagnostics
        if: always()
        working-directory: tolk
        run: |
          mkdir -p .acton/reports
          acton check --output-format sarif --output-file .acton/reports/lint.sarif

      - name: Upload Acton diagnostics and build metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acton-check-reports
          path: |
            tolk/.acton/reports/lint.sarif
            tolk/build/synchronized/abi/**
            tolk/build/synchronized/sources/**
          if-no-files-found: warn
