name: QUASAR shared checks

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      patch_artifact:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download generated patch
        if: inputs.patch_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.patch_artifact }}
          path: ${{ runner.temp }}/ai-fix

      - name: Apply generated patch
        if: inputs.patch_artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix/ai-fix.patch"
          test -s "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
        with:
          working-directory: tolk

      - name: Initialize Acton project
        working-directory: tolk
        run: acton init --stdlib-only

      - name: Verify Tolk formatting
        working-directory: tolk
        run: acton fmt --check

      - name: Lint workflow YAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet yamllint
          yamllint -c .yamllint.yml .github

      - name: Lint workflows with actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml

      - name: Lint Tolk contracts
        run: npm run lint

      - name: Build, test and synchronize canonical Tolk artifacts
        run: npm run build

      - name: Lint Tolk contracts with Acton annotations
        working-directory: tolk
        run: acton check --output-format github

      - name: Verify synchronized Tolk artifacts
        run: python3 scripts/sync_acton.py --check

      - name: Install Python dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Build and run contract and tooling tests
        run: npm test

      - name: Verify ABI snapshots
        run: npm run abi:verify

      - name: Verify the dApp opcode map against the compiled ABI
        run: npm run abi:dapp

      - name: Validate the deployment artifact (skipped when none is published)
        run: npm run deployment:check

      - name: Publish build hashes
        run: npm run hashes:build

      - name: Type-check scripts and tests
        run: npx tsc --noEmit

      - name: Verify action pins match the declared tags
        run: npm run pins:check

      - name: Audit the automation hub
        run: npm run hub:audit

      - name: Upload build-hash artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quasar-build-hashes
          path: docs/build-hashes.json
          if-no-files-found: error

      - name: Audit dependencies
        run: npm audit --audit-level=high
