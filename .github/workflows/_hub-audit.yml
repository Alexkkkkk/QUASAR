name: Automation hub audit (reusable module)

# Reusable hub-audit module (epic #145, Шаг 3 / issue #148). Same audits as
# before, now triggered through the orchestrator router instead of its own
# cron. Write permissions stay on the job level.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hub-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workflow YAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet yamllint
          yamllint -c .yamllint.yml .github

      - name: Lint workflows with actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml

      - name: Verify action pins match the declared tags
        run: npm run pins:check

      - name: Audit the automation hub (local + live settings)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run hub:audit -- --online

      - name: Regression guard for the automation surface
        run: npm run hub:test
