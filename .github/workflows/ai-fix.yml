name: AI fix (Gemini CLI, manual label only)

# ИИ-агент исправляет код ТОЛЬКО по явной метке `ai-fix`, которую ставит
# доверенный участник репозитория (issue #94). Агент работает в отдельной
# ветке и открывает DRAFT PR для человеческого review. Автоматического
# merge, deploy и on-chain действий нет.
#
# Требуется один repository secret: GEMINI_API_KEY
# (Settings → Secrets and variables → Actions). Free tier Gemini работает
# без billing; при исчерпании квоты workflow безопасно падает с понятной
# ошибкой. Ключ никогда не коммитится и не печатается в логах.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер issue для исправления'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      issue: ${{ steps.check.outputs.issue }}
    steps:
      - name: Only trusted collaborators may trigger the agent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
          EVENT: ${{ github.event_name }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            issue="$INPUT_ISSUE"
          else
            if [[ "$LABEL" != "ai-fix" ]]; then
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Label is '$LABEL', not 'ai-fix' — skipping."
              exit 0
            fi
            issue="${{ github.event.issue.number }}"
          fi

          perm=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" \
            --jq .permission 2>/dev/null || echo "none")
          case "$perm" in
            admin|write|maintain) allowed=true ;;
            *) allowed=false ;;
          esac

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          if [[ "$allowed" != "true" ]]; then
            echo "::error::$ACTOR does not have write access to this repository."
          fi

  fix:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ISSUE: ${{ needs.guard.outputs.issue }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify GEMINI_API_KEY is configured
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY не настроен. Добавьте его в Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Read the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE" --json number,title,body \
            --jq '"# Issue #\(.number): \(.title)\n\n\(.body)"' > /tmp/issue.md
          cat /tmp/issue.md

      - name: Run Gemini CLI to apply the fix
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: |
            {
              "coreTools": ["run_shell_command", "read_file", "write_file", "replace", "glob", "search_file_content"]
            }
          prompt: |
            Ты работаешь в репозитории QUASAR (TON Jetton + DeFi на Tact).
            Сначала прочитай GEMINI.md в корне и строго соблюдай его правила.

            Задача: исправить код по issue /tmp/issue.md.

            Ограничения:
            - Работай ТОЛЬКО в этом рабочем каталоге. Не делай git commit, git push,
              git merge, не деплой и не выполняй on-chain действий — это сделает
              следующий шаг workflow.
            - Не трогай секреты, .env, мнемоники и ключи.
            - Не заявляй, что проект прошёл аудит или готов к mainnet.
            - После правок запусти: npm run lint, npm run security:check,
              npm test, npx tsc --noEmit — и убедись, что они проходят.

      - name: Run repository checks on the produced diff
        run: |
          npm run lint
          npm run security:check
          npm test
          npx tsc --noEmit

      - name: Open a draft PR with the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::Агент не внёс изменений — draft PR не создаётся."
            exit 0
          fi
          branch="ai/${ISSUE}-$(date +%Y%m%d%H%M%S)"
          git config user.name  "quasar-ai-agent"
          git config user.email "quasar-ai-agent@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "ai: fix for issue #${ISSUE}"
          git push -u origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "ai: fix for issue #${ISSUE}" \
            --body "Автоматический draft PR по issue #${ISSUE} (метка \`ai-fix\`).

          Изменения внёс Gemini CLI, проверки прошли локально:
          \`npm run lint\`, \`npm run security:check\`, \`npm test\`, \`npx tsc --noEmit\`.

          **Требуется человеческий review.** Автоматического merge и deploy нет.
          Контрактные изменения требуют отдельного подтверждения (см. GEMINI.md).

          Ref #${ISSUE}"
