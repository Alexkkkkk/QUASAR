name: QUASAR Ollama issue agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to generate a patch for"
        required: true
        type: string
      model:
        description: "Ollama model tag"
        required: false
        default: "qwen2.5-coder:3b"
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-ollama-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.label.name == 'ai-fix-ollama' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.target.outputs.issue }}
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve the target issue number
        id: target
        env:
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          issue="${DISPATCH_ISSUE:-$EVENT_ISSUE}"
          if [[ -z "$issue" ]]; then
            echo "::error title=No issue number::Neither a labeled issue nor a dispatch input was provided."
            exit 1
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "Target issue: #$issue"

      - name: Build an event payload for manual runs
        id: event
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.target.outputs.issue }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --json number,title,body,labels,user > "$RUNNER_TEMP/issue.json"
          python3 - "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/manual-event.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              issue = json.load(fh)
          payload = {"issue": issue, "repository": {"default_branch": os.environ["DEFAULT_BRANCH"]}}
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY
          echo "path=$RUNNER_TEMP/manual-event.json" >> "$GITHUB_OUTPUT"

      - name: Install Ollama and load the code model
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.model || 'qwen2.5-coder:3b' }}
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl --silent --fail "$OLLAMA_HOST/api/tags" >/dev/null; then
            nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --fail "$OLLAMA_HOST/api/tags" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "::error title=Ollama did not start::The local server was not reachable within 120 seconds."
            [[ -f "$RUNNER_TEMP/ollama.log" ]] && tail -n 80 "$RUNNER_TEMP/ollama.log"
            exit 1
          fi
          ollama pull "$OLLAMA_MODEL"

      - name: Generate and preflight a scoped patch with Ollama
        shell: bash
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_MODEL: ${{ inputs.model || 'qwen2.5-coder:3b' }}
          EVENT_PATH: ${{ steps.event.outputs.path || github.event_path }}
        run: |
          set -euo pipefail
          python3 scripts/ollama_issue_agent.py \
            --event "$EVENT_PATH" \
            --output "$RUNNER_TEMP/ai-fix.patch" \
            --repo-root "$GITHUB_WORKSPACE" \
            --docs-dir docs/ton
          test -s "$RUNNER_TEMP/ai-fix.patch"
          git apply --check "$RUNNER_TEMP/ai-fix.patch"

      - name: Upload patch for isolated validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download generated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix

      - name: Apply patch in an isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix/ai-fix.patch"
          test -s "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Tact contracts
        run: npm run lint

      - name: Build and run contract and tooling tests
        run: npm test

      - name: Verify ABI snapshots
        run: npm run abi:verify

      - name: Verify the dApp opcode map against the compiled ABI
        run: npm run abi:dapp

      - name: Validate the deployment artifact (skipped when none is published)
        run: npm run deployment:check

      - name: Publish build hashes
        run: npm run hashes:build

      - name: Type-check scripts and tests
        run: npx tsc --noEmit

      - name: Verify action pins match the declared tags
        run: npm run pins:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

  open-draft-pr:
    needs: [generate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download validated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix/ai-fix.patch"
          git apply --check "$patch_file"
          git apply "$patch_file"

      - name: Create or update a draft pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/${{ needs.generate.outputs.issue }}-ollama
          base: ${{ github.event.repository.default_branch }}
          commit-message: "feat(ai-agent): address issue #${{ needs.generate.outputs.issue }}"
          title: "Ollama draft for issue #${{ needs.generate.outputs.issue }}"
          body: |
            Изменения локальной модели Ollama для #${{ needs.generate.outputs.issue }}.
            Проверьте каждую строку diff и сверьте её с официальной документацией TON
            перед переводом PR в ready.

            Патч прошёл проверки в [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Синхронизация с TON Docs: [docs/TON_DOCS_SYNC.md](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/docs/TON_DOCS_SYNC.md).

            Этот workflow создаёт только отдельную ветку и draft PR. Он не сливает изменения,
            не деплоит и не выполняет wallet/on-chain действия.

            Fixes #${{ needs.generate.outputs.issue }}
          draft: always-true
          delete-branch: true
