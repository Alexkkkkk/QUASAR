name: QUASAR Ollama pull-request agent

# Extends ai-ollama-agent.yml to pull requests. The local Ollama model receives
# a bounded, checkout-free projection of the PR (title, body, current diff) and
# returns a unified diff that is validated on an isolated checkout.
#
# Safety model (unchanged from ai-ollama-agent.yml):
#   * owner-only: the label works only for github.repository_owner;
#   * trusted code only: the workspace is always the DEFAULT branch;
#     fork label events are excluded, and no privileged PR trigger is used;
#   * protected paths are rejected and the patch must apply cleanly;
#   * the module can only open a DRAFT pull request on an ai/<pr>-ollama branch.
#     Merging stays with the existing ai-merge module: the owner adds
#     `ai-merge-ok` and the required status checks are the only quality gate.
# It never pushes to an existing branch, never merges, never deploys.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to generate a fix for"
        required: true
        type: string
      model:
        description: "Ollama model tag"
        required: false
        default: "qwen2.5-coder:3b"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-ollama-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.label.name == 'ai-fix-ollama' &&
       github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.target.outputs.pr }}
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve the target pull request number
        id: target
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr="${DISPATCH_PR:-$EVENT_PR}"
          if [[ -z "$pr" ]]; then
            echo "::error title=No pull request::Neither a labeled PR nor a dispatch input was provided."
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Target pull request: #$pr"

      - name: Project the pull request onto an issue-shaped payload
        id: event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.target.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json number,title,body,labels,author > "$RUNNER_TEMP/pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            -H "Accept: application/vnd.github.diff" > "$RUNNER_TEMP/pr.diff"
          python3 - "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr.diff" "$RUNNER_TEMP/manual-event.json" <<'PY'
          import json, os, sys
          pr_path, diff_path, out_path = sys.argv[1:4]
          with open(pr_path, encoding="utf-8") as fh:
              pr = json.load(fh)
          with open(diff_path, encoding="utf-8", errors="replace") as fh:
              diff = fh.read()[:12000]
          issue = {
              "number": pr.get("number"),
              "title": pr.get("title") or "",
              "body": (pr.get("body") or "")
              + "\n\n--- Current pull request diff ---\n"
              + diff,
              "labels": pr.get("labels") or [],
              "user": pr.get("author") or {},
          }
          payload = {
              "issue": issue,
              "repository": {"default_branch": os.environ["DEFAULT_BRANCH"]},
          }
          with open(out_path, "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY
          echo "path=$RUNNER_TEMP/manual-event.json" >> "$GITHUB_OUTPUT"

      - name: Install Ollama and load the code model
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.model || 'qwen2.5-coder:3b' }}
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl --silent --fail "$OLLAMA_HOST/api/tags" >/dev/null; then
            nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --fail "$OLLAMA_HOST/api/tags" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "::error title=Ollama did not start::The local server was not reachable within 120 seconds."
            [[ -f "$RUNNER_TEMP/ollama.log" ]] && tail -n 80 "$RUNNER_TEMP/ollama.log"
            exit 1
          fi
          ollama pull "$OLLAMA_MODEL"

      - name: Generate and preflight a scoped patch with Ollama
        shell: bash
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_MODEL: ${{ inputs.model || 'qwen2.5-coder:3b' }}
          EVENT_PATH: ${{ steps.event.outputs.path }}
        run: |
          set -euo pipefail
          python3 scripts/ollama_issue_agent.py \
            --event "$EVENT_PATH" \
            --output "$RUNNER_TEMP/ai-fix.patch" \
            --repo-root "$GITHUB_WORKSPACE" \
            --docs-dir docs/ton
          test -s "$RUNNER_TEMP/ai-fix.patch"
          git apply --check "$RUNNER_TEMP/ai-fix.patch"

      - name: Upload patch for isolated validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download generated patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix

      - name: Apply patch in an isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix/ai-fix.patch"
          test -s "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
        with:
          working-directory: tolk

      - name: Initialize Acton project
        working-directory: tolk
        run: acton init --stdlib-only

      - name: Lint Tolk contracts
        run: npm run lint

      - name: Install Python dependencies for contract tooling tests
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Build and run contract and tooling tests
        run: npm test

      - name: Verify ABI snapshots
        run: npm run abi:verify

      - name: Verify the dApp opcode map against the compiled ABI
        run: npm run abi:dapp

      - name: Validate the deployment artifact
        run: npm run deployment:check

      - name: Publish build hashes
        run: npm run hashes:build

      - name: Type-check scripts and tests
        run: npx tsc --noEmit

      - name: Verify action pins match the declared tags
        run: npm run pins:check

  open-draft-pr:
    needs: [generate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download validated patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-fix-patch
          path: ${{ runner.temp }}/ai-fix

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-fix/ai-fix.patch"
          git apply --check "$patch_file"
          git apply "$patch_file"

      - name: Create or update a draft pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/${{ needs.generate.outputs.pr }}-ollama
          base: ${{ github.event.repository.default_branch }}
          commit-message: "feat(ai-agent): address pull request #${{ needs.generate.outputs.pr }}"
          title: "Ollama draft for PR #${{ needs.generate.outputs.pr }}"
          body: |
            Изменения локальной модели Ollama для PR #${{ needs.generate.outputs.pr }}.
            Проверьте каждую строку diff и сверьте её с официальной документацией TON
            перед переводом PR в ready.

            Патч прошёл проверки в [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Синхронизация с TON Docs: [docs/TON_DOCS_SYNC.md](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/docs/TON_DOCS_SYNC.md).

            Этот workflow создаёт только отдельную ветку и draft PR. Он не сливает изменения,
            не деплоит и не выполняет wallet/on-chain действия.

            Ссылка на исходный PR: #${{ needs.generate.outputs.pr }}
          draft: always-true
          delete-branch: true
