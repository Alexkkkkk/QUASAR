name: Auto-update pull requests

# Keep every open pull-request branch (including drafts) based on the latest
# main. mergeStateStatus can be UNKNOWN while a branch is behind, so compare
# the exact baseRefOid with the current main SHA instead. This job only calls
# the GitHub API through gh; it never checks out or executes pull-request code.
# Merging is handled exclusively by automerge.yml after all required checks pass.
#
# A PAT is preferred because updates made with GITHUB_TOKEN do not trigger new
# workflow runs. Without AUTO_MERGE_TOKEN the job falls back to GITHUB_TOKEN.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Rebase all open pull-request branches onto main
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,baseRefName,baseRefOid \
            --jq '.[] | select(.baseRefName == "main") | [(.number | tostring), .baseRefOid] | @tsv')

          if [[ -z "$prs" ]]; then
            echo "No open pull requests against main."
            exit 0
          fi

          while IFS=$'\t' read -r number base_sha; do
            [[ -z "${number:-}" ]] && continue
            if [[ -z "${base_sha:-}" ]]; then
              echo "::warning title=Missing base SHA::Could not determine main base SHA for PR #${number}; leaving it untouched."
              continue
            fi

            main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
            echo "::group::PR #${number} base=${base_sha} main=${main_sha}"
            if [[ "$base_sha" == "$main_sha" ]]; then
              echo "ok: branch already uses the current main SHA"
            elif output=$(gh pr update-branch "$number" --repo "$REPO" --rebase 2>&1); then
              echo "ok: rebased onto current main"
              [[ -z "$output" ]] || echo "$output"
            else
              echo "::warning title=Rebase failed::PR #${number} could not be rebased automatically: ${output}"
            fi
            echo "::endgroup::"
          done <<< "$prs"
