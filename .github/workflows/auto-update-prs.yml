name: Auto-update pull requests

# Keeps every open pull request current with `main` and merges the green ones.
# This is the pull-request migration layer: a branch that fell behind is
# rebased onto the latest default branch, so the ruleset policy
# `strict_required_status_checks_policy` can never leave it permanently
# blocked. The job never checks out and never executes pull-request code: it
# only calls the GitHub API through `gh`.
#
# Token: the optional `AUTO_MERGE_TOKEN` repository secret (fine-grained PAT
# with `contents: write` and `pull-requests: write`) is preferred. A PAT is
# needed because a branch update performed with the ephemeral GITHUB_TOKEN
# does not start a new workflow run, which would leave the required checks
# stale. Without the secret the job degrades to `secrets.GITHUB_TOKEN`.
#
# Merge policy: only Dependabot-authored PRs may get auto-merge enabled here,
# and only after every required status context has succeeded on the current head.
# `do-not-merge` is always respected.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      merge:
        description: Enable auto-merge only for Dependabot PRs; required checks still apply
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Rebase open pull requests onto main and merge the green ones
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DO_MERGE: ${{ github.event.inputs.merge || 'true' }}
        run: |
          set -euo pipefail

          required_checks=(
            "validate / verify"
            "CodeQL"
            "Tests (contracts)"
            "Tests (dapp)"
            "Tests (python)"
            "review"
          )

          required_checks_green() {
            local number="$1" data rollup context state
            data=$(gh pr view "$number" --repo "$REPO" --json isDraft,labels,statusCheckRollup)
            [[ "$(jq -r '.isDraft' <<< "$data")" == "false" ]] || return 1
            jq -e '.labels[].name | select(. == "do-not-merge")' <<< "$data" >/dev/null && return 1
            rollup=$(jq -c '[.statusCheckRollup[]? | {name:(.name // .context), state:(.conclusion // .state // "PENDING")}]' <<< "$data")
            for context in "${required_checks[@]}"; do
              state=$(jq -r --arg context "$context" '[.[] | select(.name == $context) | .state] | if length == 0 then "MISSING" else .[-1] end' <<< "$rollup")
              if [[ "$state" != "SUCCESS" ]]; then
                echo "wait: required check '$context' is $state"
                return 1
              fi
            done
            return 0
          }

          prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,isDraft,author,labels,mergeStateStatus,baseRefName \
            --jq '.[] | select(.baseRefName == "main") | select(.isDraft == false) | [(.number | tostring), .author.login, .mergeStateStatus, ([.labels[].name] | join(","))] | @tsv')

          if [[ -z "$prs" ]]; then
            echo "No open pull requests against main."
            exit 0
          fi

          while IFS=$'\t' read -r number author state labels; do
            [[ -z "${number:-}" ]] && continue
            echo "::group::PR #${number} author=${author} state=${state} labels=${labels}"

            if [[ ",${labels}," == *",do-not-merge,"* ]]; then
              echo "skip: labelled do-not-merge"
              echo "::endgroup::"
              continue
            fi

            if [[ "$state" == "BEHIND" || "$state" == "DIRTY" ]]; then
              if gh pr update-branch "$number" --repo "$REPO" --rebase; then
                echo "ok: rebased onto main"
              else
                echo "::warning title=Rebase failed::PR #${number} could not be rebased automatically; resolve the conflict by hand."
              fi
            else
              echo "ok: already current with main (${state})"
            fi

            if [[ "$DO_MERGE" != "true" ]]; then
              echo "skip: merging disabled for this run"
              echo "::endgroup::"
              continue
            fi

            if [[ "$author" != "dependabot[bot]" ]]; then
              echo "skip: only Dependabot PRs may be auto-merged; other PRs need a human decision"
              echo "::endgroup::"
              continue
            fi

            # Do not even queue auto-merge until the exact required contexts are green.
            # The active strict ruleset remains the final, server-side merge gate.
            if ! required_checks_green "$number"; then
              echo "skip: required checks are not all green; no auto-merge queued"
              echo "::endgroup::"
              continue
            fi
            if gh pr merge "$number" --repo "$REPO" --auto --squash; then
              echo "ok: all required checks green; auto-merge queued"
            else
              echo "::warning title=Auto-merge could not be enabled::PR #${number} remains open."
            fi

            echo "::endgroup::"
          done <<< "$prs"
