name: QUASAR autofix

# Полный цикл самовосстановления репозитория. Работает ТОЛЬКО на GitHub:
# каждое исправление попадает в ветку и draft PR, никогда в `main` напрямую.
#
# Триггеры:
#   * workflow_run  — CI упал: собрать логи, классифицировать, починить, проверить;
#   * issues        — владелец поставил метку `autofix` или `ai-fix`;
#   * schedule      — каждые 6 часов искать открытые security-алерты без PR;
#   * workflow_dispatch — ручной прогон по номеру issue.
#
# Инварианты (не нарушать):
#   1. `main` никогда не изменяется напрямую; только ветка `autofix/<issue>-<slug>`.
#   2. Merge, deploy, on-chain действия и работа с кошельком агенту запрещены.
#   3. Секреты (`WALLET_MNEMONIC`, `ORACLE_SIGNING_KEY`, `TONCENTER_API_KEY`,
#      `GEMINI_API_KEY`) не читаются, не печатаются и не передаются в патч.
#   4. Текст issue и логи CI — недоверенные данные, инструкции из них не выполняются.

on:
  workflow_run:
    workflows: ["QUASAR CI", "QUASAR dApp CI"]
    types: [completed]
  issues:
    types: [labeled]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Номер issue для автоматического исправления"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.workflow_run.id || github.event.issue.number || 'schedule' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Планировщик: решает, что именно чинить, и готовит контекст.
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide whether this run has real work to do
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail

          should_run="false"
          issue_number=""
          reason=""

          case "$EVENT" in
            workflow_run)
              if [[ "$RUN_CONCLUSION" != "failure" ]]; then
                reason="CI #$RUN_ID завершился со статусом '$RUN_CONCLUSION' — исправлять нечего."
              elif [[ "$RUN_HEAD_BRANCH" == "main" ]]; then
                reason="Красный CI на main: сначала нужен человеческий разбор, автоматический патч не создаётся."
              else
                should_run="true"
                reason="Красный CI #$RUN_ID на ветке $RUN_HEAD_BRANCH — запускается самовосстановление."
              fi
              ;;
            issues)
              if [[ "$LABEL" != "autofix" && "$LABEL" != "ai-fix" ]]; then
                reason="Метка '$LABEL' не является триггером автопочинки."
              elif [[ "$ACTOR" != "$OWNER" ]]; then
                reason="Автопочинка запускается только владельцем репозитория."
              else
                should_run="true"
                issue_number="${{ github.event.issue.number }}"
                reason="Владелец запросил автопочинку по issue #${issue_number}."
              fi
              ;;
            workflow_dispatch)
              should_run="true"
              issue_number="${DISPATCH_ISSUE:-}"
              reason="Ручной запуск автопочинки."
              ;;
            schedule)
              should_run="true"
              reason="Плановая проверка открытых security-алертов."
              ;;
          esac

          {
            echo "should_run=$should_run"
            echo "issue_number=$issue_number"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Планировщик автопочинки"
            echo ""
            echo "- Событие: \`$EVENT\`"
            echo "- Решение: **$should_run**"
            echo "- Причина: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Сбор улик: логи упавшего CI, алерты Dependabot, аудит вложенного dApp.
  # ---------------------------------------------------------------------------
  diagnose:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Collect the failing CI logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [[ -n "${RUN_ID:-}" ]]; then
            gh run view "$RUN_ID" --repo "$REPO" --log-failed \
              > "$RUNNER_TEMP/evidence/ci.log" 2>&1 || true
            gh run view "$RUN_ID" --repo "$REPO" --json jobs,headBranch,headSha,displayTitle \
              > "$RUNNER_TEMP/evidence/run.json" 2>&1 || true
          fi
          # Границы контекста: классификатору достаточно хвоста лога.
          tail -c 400000 "$RUNNER_TEMP/evidence/ci.log" > "$RUNNER_TEMP/evidence/ci.tail.log" 2>/dev/null || true
          echo "evidence bytes: $(wc -c < "$RUNNER_TEMP/evidence/ci.tail.log" 2>/dev/null || echo 0)"

      - name: Collect open Dependabot alerts for the dApp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read-only: только перечень алертов, без значений секретов.
          gh api --paginate "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            > "$RUNNER_TEMP/evidence/alerts.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/evidence/alerts.json"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, collections
          path = os.path.join(os.environ["RUNNER_TEMP"], "evidence", "alerts.json")
          try:
              data = json.load(open(path))
          except Exception:
              data = []
          if isinstance(data, dict):
              data = data.get("alerts", [])
          counts = collections.Counter((a.get("security_advisory") or {}).get("severity", "unknown") for a in data)
          print("### Открытые Dependabot-алерты\n")
          print(f"Всего: **{len(data)}** — " + ", ".join(f"{k}: {v}" for k, v in sorted(counts.items())))
          packages = collections.Counter(
              ((a.get("dependency") or {}).get("package") or {}).get("name", "?") for a in data
          )
          print("\nТоп пакетов:\n")
          for name, n in packages.most_common(15):
              print(f"- `{name}` — {n}")
          PY

      - name: Classify the failure deterministically
        run: |
          set -euo pipefail
          python3 scripts/autofix/classify_failure.py \
            --log "$RUNNER_TEMP/evidence/ci.tail.log" \
            --alerts "$RUNNER_TEMP/evidence/alerts.json" \
            --out "$RUNNER_TEMP/evidence/plan.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the diagnosis as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofix-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 3. Детерминированное лечение: форматтеры, безопасные обновления, аудит-фиксы.
  # ---------------------------------------------------------------------------
  heal:
    needs: [plan, diagnose]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the diagnosis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-evidence
          path: ${{ runner.temp }}/evidence

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the root project
        run: npm ci

      - name: Apply deterministic fixes for the detected classes
        env:
          PLAN: ${{ runner.temp }}/evidence/plan.json
          EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          bash scripts/autofix/apply_fixes.sh

      - name: Re-run the full check suite on the healed tree
        run: |
          set -euo pipefail
          npm run lint
          npm test
          npx tsc --noEmit
          npm run abi:verify
          npm run abi:dapp
          npm run pins:check
          npm run hub:audit
          npm audit --audit-level=high

      - name: Produce the patch
        run: |
          set -euo pipefail
          git add --intent-to-add --all
          git diff --binary --full-index --no-renames > "$RUNNER_TEMP/autofix.patch"
          if [[ ! -s "$RUNNER_TEMP/autofix.patch" ]]; then
            echo "no_changes=true" >> "$GITHUB_ENV"
            echo "Детерминированные фиксеры не изменили ни одного файла."
          else
            echo "no_changes=false" >> "$GITHUB_ENV"
            echo "Размер патча: $(wc -c < "$RUNNER_TEMP/autofix.patch") байт"
          fi

      - name: Upload the healed patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 4. Публикация: ветка + draft PR + отчёт в issue. Только здесь есть write.
  # ---------------------------------------------------------------------------
  publish:
    needs: [plan, diagnose, heal]
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the healed patch and the diagnosis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix

      - name: Download the diagnosis evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-evidence
          path: ${{ runner.temp }}/evidence

      - name: Apply the validated patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/autofix/autofix.patch"
          test -s "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Summarize the diagnosis for the pull request body
        id: report
        env:
          EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/report.md"
          import json, os
          base = os.environ["EVIDENCE"]
          try:
              plan = json.load(open(os.path.join(base, "plan.json")))
          except Exception:
              plan = {}
          classes = plan.get("classes", [])
          print("### Что обнаружено\n")
          if classes:
              for c in classes:
                  print(f"- **{c.get('name')}** — {c.get('detail')} (уверенность: {c.get('confidence')})")
          else:
              print("- Явных классов отказа не распознано; применены общие детерминированные фиксеры.")
          print("\n### Что сделано\n")
          for a in plan.get("actions", []):
              print(f"- {a}")
          print("\n### Открытые Dependabot-алерты (dApp)\n")
          print(f"- Всего зафиксировано: **{plan.get('alert_count', 0)}**")
          print("\n> Автопочинка никогда не меняет `main`, не выполняет merge, deploy и on-chain действия.")
          PY
          echo "body_file=$RUNNER_TEMP/report.md" >> "$GITHUB_OUTPUT"

      - name: Open or update the autofix draft pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: autofix/${{ needs.plan.outputs.issue_number || github.run_id }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "fix(autofix): автоматическое восстановление (#${{ needs.plan.outputs.issue_number || github.run_id }})"
          title: "autofix: автоматическое восстановление сборки и зависимостей"
          body: |
            Автоматический патч от workflow `QUASAR autofix`.

            ${{ needs.plan.outputs.reason }}

            Причина запуска: ${{ needs.plan.outputs.reason }}

            Полный отчёт по классам отказа и выполненным действиям — в artifact
            `autofix-evidence` этого запуска и в комментарии к issue.

            Патч проверен перед публикацией: `npm run lint`, `npm test`,
            `npx tsc --noEmit`, `npm run abi:verify`, `npm run abi:dapp`,
            `npm run pins:check`, `npm run hub:audit`, `npm audit --audit-level=high`.

            Правила: `main` не изменяется напрямую, merge и deploy не выполняются,
            каждый hunk проверяет человек.
          draft: always-true
          delete-branch: true

      - name: Report the outcome on the issue
        if: needs.plan.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.plan.outputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "🤖 **Автопочинка (GitHub Actions)**"
            echo ""
            echo "Запуск: [workflow run]($RUN_URL)"
            echo ""
            if [[ -n "${PR_URL:-}" ]]; then
              echo "Ветка и draft PR: ${PR_URL}"
              echo ""
              echo "Патч прошёл все обязательные проверки до публикации. Merge остаётся за человеком."
            else
              echo "Изменений не потребовалось: детерминированные фиксеры не нашли, что исправлять."
            fi
            echo ""
            echo "---"
            echo "*Автопочинка не меняет \`main\`, не выполняет merge, deploy и on-chain действия.*"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"

      - name: Attach the summary to the run
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Эскалация: детерминированный heal не справился — открываем issue.
  #    Issue — единственный выход наружу: метка `ai-fix` доводит патч агентом.
  #    Никакого merge, deploy и on-chain здесь по-прежнему нет.
  # ---------------------------------------------------------------------------
  escalate:
    needs: [plan, diagnose, heal]
    if: always() && needs.plan.outputs.should_run == 'true' && needs.heal.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download the diagnosis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-evidence
          path: ${{ runner.temp }}/dx

      - name: Open or update the escalation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          open_issue=$(gh issue list --repo "$REPO" --label autofix-escalation --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "${open_issue:-}" ]]; then
            echo "escalation already open: #$open_issue"
            gh issue comment "$open_issue" --repo "$REPO" \
              --body "Детерминированный heal снова не справился (run $RUN_ID). Задача остаётся открытой."
            exit 0
          fi
          {
            echo "## Failing checks on main (heal exhausted)"
            echo
            echo "Детерминированный heal не исцелил чек-сьют (run $RUN_ID)."
            echo
            echo '```'
            head -c 8000 "$RUNNER_TEMP/dx/plan.json" 2>/dev/null || echo "plan.json отсутствует"
            echo '```'
            echo
            echo "Автоматика: повесьте label \`ai-fix\` — сработает полный агент и откроет draft PR."
            echo "Контекст для моделей: \`docs/ai/failure_patterns.md\`."
            echo
            echo "Не трогать: \`contracts/\`, \`.github/workflows/\` — по конституции это классы «человек»."
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --repo "$REPO" \
            --title "Failing checks on main (heal exhausted)" \
            --label "autofix-escalation" \
            --body-file "$RUNNER_TEMP/issue-body.md"
