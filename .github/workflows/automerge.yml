name: automerge
# Promotes and queues every eligible pull request only after all required CI is green.
#
# "Green" means: every check required by the active branch ruleset
# (validate / verify, CodeQL, Tests (contracts), Tests (dapp),
# Tests (python), review) has SUCCEEDED on the pull request head commit,
# and the branch has no merge conflicts. Green drafts are marked ready here;
# drafts with missing, pending, skipped, or failed checks stay drafts. Pull
# requests carrying `do-not-merge` are never touched.
#
# The job only talks to the GitHub API through `gh`. It never checks out and
# never executes pull-request code, so it is safe to run on untrusted PRs.
#
# Permissions follow the repository policy: the workflow level stays
# read-only and the write scopes live on the job.
on:
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automerge
  cancel-in-progress: true
jobs:
  automerge:
    name: automerge
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve merge token (GitHub App -> static PAT -> GITHUB_TOKEN)
        id: auth
        env:
          APP_ID: ${{ secrets.QUASAR_APP_ID }}
          APP_KEY: ${{ secrets.QUASAR_APP_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_KEY:-}" ]; then
            echo "::notice title=automerge::QUASAR_APP_ID/QUASAR_APP_KEY not set - using static AUTO_MERGE_TOKEN fallback (no auto-rotation yet)."
            exit 0
          fi
          printf '%s' "$APP_KEY" > /tmp/app.pem
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now-30))" "$((now+540))" "$APP_ID" | b64url)
          sig=$(printf '%s' "$h.$p" | openssl dgst -sha256 -sign /tmp/app.pem | b64url)
          jwt="$h.$p.$sig"
          rm -f /tmp/app.pem
          inst=$(curl -sf -H "Authorization: Bearer $jwt" https://api.github.com/app/installations \
                  | jq -r --arg owner "$OWNER" 'map(select(.account.login==$owner)) | .[0].id // empty')
          if [ -z "$inst" ]; then
            echo "::warning title=automerge::GitHub App is not installed for $OWNER - falling back to AUTO_MERGE_TOKEN."
            exit 0
          fi
          tok=$(curl -sf -X POST -H "Authorization: Bearer $jwt" \
                  "https://api.github.com/app/installations/$inst/access_tokens" | jq -r '.token // empty')
          if [ -z "$tok" ]; then
            echo "::warning title=automerge::Could not mint installation token - falling back to AUTO_MERGE_TOKEN."
            exit 0
          fi
          echo "token=$tok" >> "$GITHUB_OUTPUT"
          echo "Resolved merge token: GitHub App installation token (expires in ~1h, auto-rotated every run)."

      - name: Queue eligible pull requests after required checks pass
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token || secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "=== automerge run $(date -u +%FT%TZ) on $REPO ==="
          if [ -z "${AUTO_MERGE_TOKEN:-}" ]; then
            echo "::warning title=automerge::AUTO_MERGE_TOKEN is not set, using the ephemeral GITHUB_TOKEN."
          fi
          armed=0; waiting=0; skipped=0; failed=0
          required_checks=(
            "validate / verify"
            "CodeQL"
            "Tests (contracts)"
            "Tests (dapp)"
            "Tests (python)"
            "review"
          )
          for n in $(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[].number'); do
            if ! pr=$(gh api "repos/$REPO/pulls/$n"); then
              echo "    skip: could not read pull request"; failed=$((failed+1)); continue
            fi
            title=$(jq -r '.title' <<< "$pr")
            draft=$(jq -r '.draft' <<< "$pr")
            mergeable=$(jq -r '.mergeable' <<< "$pr")
            state=$(jq -r '.mergeable_state' <<< "$pr")
            labels=$(jq -r '[.labels[].name] | join(",")' <<< "$pr")
            auto=$(jq -r 'if .auto_merge then "yes" else "no" end' <<< "$pr")
            echo "--- #$n state=$state mergeable=$mergeable draft=$draft auto_merge=$auto labels=[$labels] :: $title"
            case ",$labels," in
              *,do-not-merge,*) echo "    skip: labelled do-not-merge"; skipped=$((skipped+1)); continue ;;
            esac
            if [ "$mergeable" = "false" ] || [ "$state" = "dirty" ]; then
              echo "    skip: merge conflicts"; skipped=$((skipped+1)); continue
            fi

            if ! check_data=$(gh pr view "$n" --repo "$REPO" --json headRefOid,statusCheckRollup); then
              echo "    skip: could not read status checks"; failed=$((failed+1)); continue
            fi
            head=$(jq -r '.headRefOid' <<< "$check_data")
            rollup=$(jq -c '[.statusCheckRollup[]? | {name:(.name // .context), state:(.conclusion // .state // "PENDING")}]' <<< "$check_data")
            checks_green=true
            for context in "${required_checks[@]}"; do
              result=$(jq -r --arg context "$context" '[.[] | select(.name == $context) | .state] | if length == 0 then "MISSING" else .[-1] end' <<< "$rollup")
              if [ "$result" != "SUCCESS" ]; then
                echo "    wait: required check '$context' is $result"
                checks_green=false
              fi
            done
            if [ "$checks_green" != "true" ]; then
              waiting=$((waiting+1)); continue
            fi

            if [ "$draft" = "true" ]; then
              if ! out=$(gh pr ready "$n" --repo "$REPO" 2>&1); then
                echo "    ::warning title=automerge::could not mark green draft #$n ready: $out"
                failed=$((failed+1)); continue
              fi
              current_head=$(gh pr view "$n" --repo "$REPO" --json headRefOid --jq '.headRefOid')
              if [ "$current_head" != "$head" ]; then
                echo "    wait: head changed while promoting draft; fresh checks are required"
                waiting=$((waiting+1)); continue
              fi
            fi
            if [ "$auto" = "yes" ]; then
              echo "    required checks green; auto-merge already armed"
              waiting=$((waiting+1)); continue
            fi
            if out=$(gh pr merge "$n" --repo "$REPO" --auto --squash --delete-branch 2>&1); then
              echo "    required checks green; auto-merge queued (squash)"; armed=$((armed+1))
            else
              echo "    ::warning title=automerge::could not arm auto-merge on #$n: $out"
              failed=$((failed+1))
            fi
          done
          echo "=== summary: armed=$armed waiting=$waiting skipped=$skipped failed=$failed ==="
