name: Autopilot auto-merge

# Turns on GitHub native auto-merge (squash) for EVERY pull request in the
# repository, regardless of base or head branch. The PR then merges itself
# as soon as all required checks / reviews pass. Draft PRs are skipped
# until they are marked ready for review.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge (squash, delete branch after merge)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr merge "$PR" --auto --squash --delete-branch; then
            echo "✅ auto-merge enabled for PR #$PR"
          else
            echo "::notice::Auto-merge not enabled for PR #$PR (possibly already set or PR not mergeable yet)."
          fi
