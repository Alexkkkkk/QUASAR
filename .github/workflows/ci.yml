name: QUASAR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede runs on pull requests only. On a push to `main` this workflow
  # reports the required `validate / verify` status, so cancelling those runs
  # would drop the mandatory check result for the merged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/_checks.yml
    with:
      ref: ${{ github.sha }}

  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Tolk-only review invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f tolk/Acton.toml
          test -d tolk/contracts
          test -d tolk/tests
          if find . -type f \( -name '*.tact' -o -name '*.func' -o -name '*.fc' \) -print -quit | grep -q .; then
            echo 'legacy contract source detected' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(check_migration_parity\.py|test_tolk_migration_parity\.py)$'; then
            echo 'legacy migration parity tooling detected' >&2
            exit 1
          fi
          echo 'review invariants passed: canonical Tolk/Acton repository'
