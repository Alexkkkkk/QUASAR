name: QUASAR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede runs on pull requests only. On a push to `main` this workflow
  # reports the required `validate / verify` status, so cancelling those runs
  # would drop the mandatory check result for the merged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/_checks.yml
    with:
      ref: ${{ github.sha }}
