name: QUASAR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the toolchain: the CI Node version is read
          # from .nvmrc so a local green run reproduces CI exactly and the
          # compiled code hash stays deterministic (audit 2026-10-02).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Tact contracts
        run: npm run lint

      - name: Build and run contract tests
        run: npm test

      - name: Verify ABI snapshots
        run: npm run abi:verify

      - name: Verify the dApp opcode map against the compiled ABI
        run: npm run abi:dapp

      - name: Validate the deployment artifact (skipped when none is published)
        run: npm run deployment:check

      - name: Publish build hashes
        run: npm run hashes:build

      - name: Upload build-hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasar-build-hashes
          path: docs/build-hashes.json

      - name: Type-check scripts and tests
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: npm audit --audit-level=high
