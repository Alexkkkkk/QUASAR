name: Dependabot auto-merge

# WHY pull_request_target: pull requests opened by Dependabot receive a
# read-only GITHUB_TOKEN under `pull_request`, so the merge API call cannot
# be made. GitHub's documented pattern is `pull_request_target` with an actor
# guard. This job is safe by construction: it never checks out pull-request
# code, never runs repository scripts and never reads a secret. It only asks
# GitHub to merge a Dependabot pull request once the required checks are
# green. This workflow does not require approving reviews. Drafts, missing or
# non-green required checks, and `do-not-merge` PRs are left untouched.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the dependency update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge only after required checks are green
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          required_checks=(
            "validate / verify"
            "CodeQL"
            "Tests (contracts)"
            "Tests (dapp)"
            "Tests (python)"
            "review"
          )
          pr=$(gh pr view "$PR_URL" --repo "$REPO" --json isDraft,labels,statusCheckRollup)
          if [[ "$(jq -r '.isDraft' <<< "$pr")" == "true" ]] || jq -e '.labels[].name | select(. == "do-not-merge")' <<< "$pr" >/dev/null; then
            echo "skip: draft or do-not-merge label is present"
            exit 0
          fi
          rollup=$(jq -c '[.statusCheckRollup[]? | {name:(.name // .context), state:(.conclusion // .state // "PENDING")}]' <<< "$pr")
          for context in "${required_checks[@]}"; do
            state=$(jq -r --arg context "$context" '[.[] | select(.name == $context) | .state] | if length == 0 then "MISSING" else .[-1] end' <<< "$rollup")
            if [[ "$state" != "SUCCESS" ]]; then
              echo "skip: required check '$context' is $state; no auto-merge queued"
              exit 0
            fi
          done
          gh pr merge --auto --squash "$PR_URL"

      - name: Note major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_URL" --body "Major update: auto-merge is enabled only after all required checks are green; subsequent checks and strict branch protection remain enforced."
