name: Deploy website to GitHub Pages

# Serves `website/` at a stable, anonymous HTTPS origin so that the TEP-74
# jetton metadata URL, the TON Connect manifest and its iconUrl all resolve
# with the correct MIME type. Per the TON Connect manifest specification the
# dApp origin must host the manifest, so this workflow is the source of truth
# for the "url" field in website/tonconnect-manifest.json.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
      actions: read
    # Deploy gate: production publishes only after the shared checks
    # (lint, actionlint, contract tests, ABI snapshots, pins, hub audit)
    # pass on the deployed ref.
    uses: ./.github/workflows/_checks.yml
    with:
      ref: ${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Enable Pages automatically if the repository has not switched its
          # Pages source to "GitHub Actions" yet.
          enablement: true

      - name: Upload website as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
