name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
        with:
          working-directory: tolk

      - name: Initialize Acton project
        working-directory: tolk
        run: acton init

      - name: Build and test the exact release revision
        run: npm test

      - name: Verify ABI and dApp opcode snapshots
        run: |
          npm run abi:verify
          npm run abi:dapp

      - name: Publish build hashes
        run: npm run hashes:build

      - name: Verify action pins match the declared tags
        run: npm run pins:check

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp -RL tolk/build/synchronized dist-release/tolk-build
          cp docs/build-hashes.json dist-release/build-hashes.json
          cp -R docs/abi dist-release/abi
          cd dist-release && zip -qr ../quasar-release.zip .

      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quasar-release
          path: quasar-release.zip
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download the verified bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quasar-release

      - name: Attest the release bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: quasar-release.zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Release tag must start with v and contain only safe version-tag characters."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - uploading the verified bundle."
            gh release upload "$tag" quasar-release.zip --clobber
          else
            gh release create "$tag" quasar-release.zip \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
