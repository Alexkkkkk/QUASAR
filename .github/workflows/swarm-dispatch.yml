name: swarm-dispatch

# Event router for swarm knowledge changes:
#   change -> validate schema, poison scan, consistency, and run unit tests
#   manual -> workflow_dispatch runs the same checks and then the full learning
#             cycle through the reusable _ai-swarm.yml module
# The resident (idle) learning loop lives in swarm-watch.yml; this hub owns no
# schedule of its own (#223 removed the duplicate cycle, PR #217 keeps the
# on-demand path to the learning module).

on:
  push:
    branches:
      - main
    paths:
      - 'docs/ai/knowledge/**'
      - 'scripts/ai/swarm/**'
  pull_request:
    paths:
      - 'docs/ai/knowledge/**'
      - 'scripts/ai/swarm/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-dispatch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Gate knowledge changes (schema, poison, consistency)
        run: node scripts/ai/swarm/cli.mjs sync

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Swarm unit tests
        run: node --test tests/swarm/swarm.test.mjs
