name: swarm-dispatch

# Event router for the swarm — the swarm's "nervous system":
#   change  -> gate (schema, poison scan, consistency) + unit tests
#   poll    -> every minute a cheap scout checks for new lessons and runs
#              the full cycle only when something changed
#   manual  -> workflow_dispatch forces a full cycle
# The resident Ollama loop lives in swarm-watch.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/ai/knowledge/**'
      - 'scripts/ai/swarm/**'
  pull_request:
    paths:
      - 'docs/ai/knowledge/**'
      - 'scripts/ai/swarm/**'
  schedule:
    - cron: '*/5 * * * *'    # cheap poll every 5 min (GitHub minimum; minute-precision lives in swarm-watch)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-dispatch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Gate knowledge changes (schema, poison, consistency)
        run: node scripts/ai/swarm/cli.mjs sync

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Swarm unit tests
        run: node --test tests/swarm/swarm.test.mjs

  # Minute poll. Backend from repo variable SWARM_LLM (default groq); when no
  # API key is set, learning runs deterministically. The scout job inside
  # _ai-swarm.yml skips the expensive cycle when there is nothing new.
  cycle:
    needs: [gate, test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_ai-swarm.yml
