extends: default

rules:
  line-length: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  truthy:
    allowed-values: ["true", "false", "on"]
  empty-lines:
    max: 1
    max-end: 0
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
