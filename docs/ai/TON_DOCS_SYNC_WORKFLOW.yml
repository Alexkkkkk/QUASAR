name: Sync official TON Docs context

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Refresh the allowlisted Markdown pages
        run: python3 scripts/sync_ton_docs.py

      - name: Create or update a draft documentation PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-ton-docs
          base: ${{ github.event.repository.default_branch }}
          commit-message: "docs(ton): sync official documentation snapshot"
          title: "docs(ton): sync official TON documentation"
          body: |
            Автоматически обновлён локальный Markdown-снимок выбранных страниц docs.ton.org для RAG-контекста AI issue agent.
            Проверьте изменения как техническую документацию. Этот PR не меняет контракты и не является аудитом или подтверждением готовности к testnet/mainnet.
          draft: true
          delete-branch: true