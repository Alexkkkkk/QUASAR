name: learn
on:
  workflow_call:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect outcome history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --limit 200 --json workflowName,conclusion,createdAt,displayTitle \
            > /tmp/runs.json
          gh pr list --state all --limit 100 --json number,title,labels,mergedAt \
            > /tmp/prs.json
          gh issue list --state all --limit 100 --json number,title,labels,state \
            > /tmp/issues.json
      - name: Update failure memory
        run: python3 scripts/learn_loop.py --runs /tmp/runs.json \
             --prs /tmp/prs.json --issues /tmp/issues.json \
             --patterns docs/ai/failure_patterns.md
      - name: Open self-improvement PR if patterns changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [[ -z "$changed" ]]; then echo "no changes"; exit 0; fi
          blocked=$(printf '%s\n' "$changed" | grep -E '^(\.github/workflows/|contracts/)' || true)
          [[ -z "$blocked" ]] || { echo "::error::Learn touched protected paths"; exit 1; }
          git config user.name quasar-autopilot
          git config user.email autopilot@users.noreply.github.com
          branch="autopilot/learn-$(date +%F)"
          git checkout -b "$branch"
          git add docs/ai/failure_patterns.md
          git commit -m "docs(autopilot): nightly failure-pattern update"
          git push -u origin "$branch"
          gh pr create --title "Autopilot: failure-pattern update $(date +%F)" \
            --body "Nightly learn loop. Gates: _checks, _ai-review, merge-bot." --draft
