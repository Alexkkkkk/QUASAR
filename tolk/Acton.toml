[package]
name = "quasar-tolk"
description = "Canonical QUASAR smart contracts implemented in Tolk"
version = "3.0.0"
repository = "https://github.com/Alexkkkkk/QUASAR"
license = "MIT"

[toolchain]
acton = "1.2.1"

[contracts.QuasarWallet]
display-name = "QUASAR Jetton Wallet"
src = "contracts/QuasarWallet.tolk"
depends = []

[contracts.QuasarMaster]
display-name = "QUASAR Jetton Master"
src = "contracts/QuasarMaster.tolk"
depends = ["QuasarWallet"]

[contracts.QuasarDeFi]
display-name = "QUASAR DeFi"
src = "contracts/QuasarDeFi.tolk"
depends = ["QuasarWallet"]

[contracts.QuasarAdminTimelock]
display-name = "QUASAR Admin Timelock"
src = "contracts/QuasarAdminTimelock.tolk"
depends = []

[build]
out-dir = "build/synchronized/artifacts"
gen-dir = "build/synchronized/gen"
output-abi = "build/synchronized/abi"
output-boc = "build/synchronized/boc"
output-fift = "build/synchronized/fift"
output-sources = "build/synchronized/sources"

[test]
fail-fast = true

[lint]
max-warnings = 0
exclude = ["build/synchronized/wrappers/*.tolk", "build/generations/**/wrappers/*.tolk"]

[scripts]
local-smoke = "acton script scripts/local-smoke.tolk"
storage-fee = "acton script scripts/storage-fee.tolk 3600"

[fmt]
width = 100
ignore = []

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "build/synchronized/gen"
tests = "tests"
wrappers = "build/synchronized/wrappers"
